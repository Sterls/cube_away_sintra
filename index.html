<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Cube Away</title>
  <meta name="description" content="A calm 3D cube puzzle. No ads.">
  <meta name="theme-color" content="#efe9ff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="stage"></div>

  <!-- Home -->
  <section id="home" class="screen">
    <div class="logo" aria-hidden="true">
      <div class="logo-cube"><span>&#8593;</span></div>
      <div class="logo-cube b"><span>&#8594;</span></div>
      <div class="logo-cube c"><span>&#8592;</span></div>
    </div>
    <h1>Cube Away</h1>
    <p class="tagline">Tap a cube to send it flying.<br>Clear them all!</p>
    <button id="play-btn" class="btn big">Play</button>
    <button id="levels-btn" class="btn secondary">Levels</button>
    <button id="settings-btn" class="btn ghost">Settings</button>
  </section>

  <!-- Level select -->
  <section id="levels" class="screen hidden">
    <header class="bar">
      <button class="icon-btn" data-back aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2>Levels</h2>
      <span class="bar-spacer"></span>
    </header>
    <div id="level-grid"></div>
  </section>

  <!-- In-game controls -->
  <section id="hud" class="hidden">
    <header class="bar">
      <button class="icon-btn" data-back aria-label="Back to menu">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="hud-title">
        <div id="hud-level">Level 1</div>
        <div id="hud-left">0 cubes left</div>
      </div>
      <button id="restart-btn" class="icon-btn" aria-label="Restart level">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5"/></svg>
      </button>
    </header>
    <div id="help" class="help hidden">Tap a cube to slide it out.<br>Drag to turn &middot; pinch to zoom.</div>
    <footer class="hud-bottom">
      <div id="hud-mistakes" class="mistakes" aria-live="polite"></div>
      <button id="hint-btn" class="btn hint">
        <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
        Hint
      </button>
    </footer>
  </section>

  <!-- Level complete -->
  <div id="win" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="win-title">
    <div class="card">
      <div id="win-stars" class="stars"></div>
      <h2 id="win-title">Level complete!</h2>
      <p id="win-text"></p>
      <button id="next-btn" class="btn big">Next level</button>
      <button id="win-menu-btn" class="btn ghost">Menu</button>
    </div>
  </div>

  <!-- Settings -->
  <div id="settings" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="card">
      <h2 id="settings-title">Settings</h2>
      <label class="toggle"><span>Sound</span><input type="checkbox" id="sound-toggle"><i></i></label>
      <label class="toggle"><span>Vibration</span><input type="checkbox" id="vibrate-toggle"><i></i></label>
      <button id="reset-btn" class="btn ghost danger">Reset progress</button>
      <button id="settings-close" class="btn">Done</button>
    </div>
  </div>

  <div id="error" class="hidden">
    Sorry, this phone's browser couldn't start the 3D view.<br>Try opening it in Chrome.
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
